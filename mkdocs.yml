site_name: AKBGwiki
site_description: AKB48 Group 历代演唱会、剧场公演、音乐与娱乐番组资料归档维基
site_author: 管理员
copyright: 本站为非营利粉丝资料归档站，不存储任何音视频文件，所有外部链接均来自互联网公开平台。

repo_url: https://github.com/48fanwiki/akbg-wiki
repo_name: 48fanwiki/akbg-wiki
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  custom_dir: overrides
  # 禁用海外 Google Fonts 加载，改用 extra.css 本地字体栈，国内秒开
  font: false
  icon:
    logo: material/music-circle
    edit: material/pencil
    view: material/eye
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.action.edit
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-7
        name: 切换到护眼夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: pink
      accent: pink
      toggle:
        icon: material/brightness-4
        name: 切换到清新日间模式

# 禁用内置 search 插件，改用 hooks/build_hooks.py 在构建后生成 Pagefind 中文分片索引
plugins: []

hooks:
  - hooks/build_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.magiclink
  - pymdownx.keys
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

